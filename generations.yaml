generations:
  - name: "First Generation"
    start_year: 1999
    end_year: 2006
    description: "The original Honda HR-V was a pioneering compact crossover SUV introduced primarily for the Japanese and European markets. Marketed from February 1999 in three-door configuration (GH1/GH2) with five-door models (GH3/GH4) following in March 2000. Featuring distinctive boxy styling with a high roofline, it was marketed as a 'Joy Machine' that combined car-like handling with SUV versatility. Built on the Honda Logo platform, it was available with a 1.6L SOHC D16W1 engine (105 PS) or the more powerful VTEC-equipped D16W5 variant (125 PS). Front-wheel drive and Honda's Real Time 4WD system were available. The five-door model was 110mm longer with a 100mm longer wheelbase. A gentle exterior and interior facelift was applied for the 2002 model year."

  - name: "First Generation (2002 Facelift)"
    start_year: 2002
    end_year: 2006
    description: "The facelifted HR-V featured updated exterior styling including revised front and rear bumper designs, new headlight and taillight configurations, and interior updates to the dashboard and trim materials. This refresh helped maintain customer interest in the aging platform as it approached end of life. The mechanical specifications remained largely unchanged, continuing with the 1.6L D16W1 and VTEC-equipped D16W5 engines paired with either 5-speed manual or Honda Multimatic S CVT. Production continued through 2006 before the nameplate entered a seven-year hiatus."

  - name: "Second Generation"
    start_year: 2013
    end_year: 2022
    description: "After a seven-year hiatus, Honda reintroduced the HR-V nameplate on an all-new vehicle based on the third-generation Honda Fit/Jazz platform, internally designated RU1-RU5. Previewed by the Urban SUV Concept at the 2013 Detroit Auto Show, production began in December 2013 for Japan as the Honda Vezel. European sales commenced September 2015, with North American availability starting May 2015 as a 2016 model. The coupe-like styling featured hidden rear door handles and Honda's 'Solid Wing Face' design language. Powered by various engines including 1.5L i-VTEC, 1.8L i-VTEC, 1.5L turbo, and a 1.6L diesel in Europe. The hybrid version used Honda's Sport Hybrid i-DCD system with a 1.5L Atkinson-cycle engine and dual-clutch transmission."

  - name: "Second Generation (2018 Facelift)"
    start_year: 2018
    end_year: 2022
    description: "The mid-cycle facelift was unveiled on January 25, 2018 in Japan and released February 15, 2018. Exterior updates included a revised chrome bar grille similar to the Honda Civic, updated LED headlamps with new projector lens design featuring DRLs or full LED lighting on higher trims, and a redesigned front bumper with updated fog light housings. The interior received Apple CarPlay and Android Auto integration, a revised head unit with volume knob replacing the slider, and updated trim materials. The 2019 model year for North America added Sport and Touring trim levels while discontinuing the manual transmission. The Real Time 4WD system was also updated with improved response."

  - name: "Third Generation (Global)"
    start_year: 2021
    end_year: null
    description: "The global third-generation HR-V (known as Vezel in Japan, internal codes RV/RS1) was unveiled on February 18, 2021 with sales commencing April 22, 2021. Built on the fourth-generation Honda Fit/Jazz platform (Honda Global Small Car), it features cleaner design with horizontal lines, a longer hood, and more upright stance compared to its predecessor. The signature hidden rear door handles were retained. Powertrain options focus on Honda's e:HEV hybrid system combining a 1.5L Atkinson-cycle engine with electric motors for combined output of 132 PS, paired with a seven-speed dual-clutch transmission. Conventional powertrains include 1.5L and 1.5L turbo engines. The interior features a minimalist design with Magic Seat system providing exceptional versatility. Technology includes the latest Honda Sensing safety suite and available 9-inch touchscreen infotainment."

  - name: "Third Generation (North America / China)"
    start_year: 2022
    end_year: null
    description: "The North American HR-V diverged significantly from the global model, built on the eleventh-generation Honda Civic platform (internal code RZ) rather than the Fit/Jazz basis used elsewhere. Significantly larger with more conventional SUV styling including a prominent grille and horizontal body lines, it positions above the previous generation in Honda's crossover lineup. Without the Fit's Magic Seat system, it offers a more traditional interior layout with substantially more passenger and cargo space. Powered exclusively by a 2.0L naturally aspirated four-cylinder engine (158 HP) paired with CVT transmission in the United States. The interior shares design elements with the Civic including honeycomb-pattern dash accents and available 9-inch touchscreen. Standard Honda Sensing across all trims. Outside North America and China, this model is marketed as the Honda ZR-V."